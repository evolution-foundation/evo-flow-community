name: unit tests

# Runs the whole jest suite on every PR. The other workflows only run targeted
# guards, so a broken spec anywhere else merged without anyone seeing it.
# Integration suites (Kafka, RabbitMQ, Redis) skip themselves without their env.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# npm ci runs third-party install scripts; the token they could reach stays read-only.
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Pinned: on a 2-vCPU runner jest falls back to in-band, where open handles
      # keep it from exiting for ~5 min after the run finishes.
      - name: Run the full suite
        run: npx jest --ci --maxWorkers=2
